<div class="login-shell">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>SmartCity Tunisia</mat-card-title>
      <mat-card-subtitle>Sign in to continue</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email" autocomplete="username" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput formControlName="password" type="password" autocomplete="current-password" />
        </mat-form-field>

        @if (errorMessage) {
          <p class="error-message" role="alert">{{ errorMessage }}</p>
        }

        <button mat-flat-button color="primary" class="full-width" type="submit" [disabled]="isSubmitting || form.invalid">
          {{ isSubmitting ? 'Signing in…' : 'Login' }}
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
