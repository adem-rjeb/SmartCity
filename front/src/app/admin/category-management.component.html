<mat-card class="categories-card">
  <mat-card-header>
    <mat-card-title>Category Management</mat-card-title>
    <mat-card-subtitle>Manage issue categories</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <button mat-flat-button color="primary" class="add-btn" (click)="addCategory()">+ Add Category</button>

    <div *ngIf="isLoading" class="loading-container">
      <mat-spinner></mat-spinner>
    </div>

    <table mat-table [dataSource]="(categories$ | async)!" *ngIf="!isLoading">
      <ng-container matColumnDef="nom">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let cat">{{ cat.nom }}</td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Description</th>
        <td mat-cell *matCellDef="let cat">{{ cat.description }}</td>
      </ng-container>

      <ng-container matColumnDef="prioriteParDefaut">
        <th mat-header-cell *matHeaderCellDef>Default Priority</th>
        <td mat-cell *matCellDef="let cat">{{ cat.prioriteParDefaut }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let cat">
          <button mat-icon-button (click)="editCategory(cat)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteCategory(cat)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </mat-card-content>
</mat-card>
