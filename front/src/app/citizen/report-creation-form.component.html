<mat-card class="form-card">
  <mat-card-header>
    <mat-card-title>Report an Issue</mat-card-title>
    <mat-card-subtitle>Help improve our city by reporting problems</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <!-- Category Selection -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Category</mat-label>
        <mat-icon matPrefix>category</mat-icon>
        <mat-select formControlName="categoryId">
          <mat-option *ngFor="let cat of (categories$ | async)" [value]="cat.id">
            {{ cat.nom }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <!-- Title -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Title</mat-label>
        <mat-icon matPrefix>title</mat-icon>
        <input matInput formControlName="titre" placeholder="Brief title of the issue" />
      </mat-form-field>

      <!-- Description -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Description</mat-label>
        <mat-icon matPrefix>description</mat-icon>
        <textarea
          matInput
          formControlName="description"
          rows="4"
          placeholder="Detailed description"
        ></textarea>
      </mat-form-field>

      <!-- Address -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Address</mat-label>
        <mat-icon matPrefix>place</mat-icon>
        <input matInput formControlName="adresse" placeholder="Street address or location" />
      </mat-form-field>

      <!-- Geolocation Grid -->
      <div class="geo-grid">
        <mat-form-field appearance="outline">
          <mat-label>Latitude</mat-label>
          <mat-icon matPrefix>my_location</mat-icon>
          <input matInput formControlName="latitude" type="number" readonly />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Longitude</mat-label>
          <mat-icon matPrefix>my_location</mat-icon>
          <input matInput formControlName="longitude" type="number" readonly />
        </mat-form-field>
        <button mat-stroked-button type="button" class="geo-btn" (click)="detectGeolocation()">
          <span class="material-icons" style="font-size:16px;vertical-align:middle;margin-right:4px">my_location</span>
          Detect location
        </button>
      </div>

      <div class="map-section">
        <p class="map-hint">Drag the marker or click the map to set the exact location.</p>
        <div #mapContainer class="map-container" role="img" aria-label="Location map"></div>
      </div>

      <!-- Photo Upload -->
      <div class="photo-upload">
        <label>Photo (optional):</label>
        <input type="file" accept="image/*" (change)="onPhotoSelected($event)" />
        <p *ngIf="selectedFileName">Selected: {{ selectedFileName }}</p>
      </div>

      <!-- Buttons -->
      <div class="button-group">
        <button
          mat-flat-button
          color="primary"
          type="submit"
          [disabled]="form.invalid || isSubmitting"
        >
          <mat-spinner *ngIf="isSubmitting" diameter="20"></mat-spinner>
          {{ isSubmitting ? 'Submitting...' : 'Submit Report' }}
        </button>
        <button mat-stroked-button type="button" (click)="resetForm()">Clear</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
